name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `prisma generate` / `next build` succeed without a real DB.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/cofoundr?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-ci-placeholder-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
