services:
  postgres:
    image: postgres:16-alpine
    container_name: cofoundr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cofoundr
      POSTGRES_PASSWORD: cofoundr
      POSTGRES_DB: cofoundr
    ports:
      - "5432:5432"
    volumes:
      - cofoundr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofoundr -d cofoundr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cofoundr_pgdata:
